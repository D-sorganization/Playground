name: Nightly Documentation Organizer

on:
  schedule:
    - cron: "0 8 * * 2" # Daily at 3 AM PST (11 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Dispatcher: route to self-hosted if available ──────────────────────────
  pick-runner:
    runs-on: ${{ vars.RUNNER_TARGET == 'local' && 'd-sorg-fleet' || 'ubuntu-latest' }}
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Select runner
        id: check
        env:
          REPO_VISIBILITY: ${{ github.event.repository.visibility }}
          RUNNER_TARGET: ${{ vars.RUNNER_TARGET }}
        run: |
          mkdir -p "$(dirname "$GITHUB_OUTPUT")"
          if [ "$REPO_VISIBILITY" != "public" ]; then
            # Hosted runners are billed on a non-public repo, so routing is not a
            # preference here and RUNNER_TARGET deliberately does not apply.
            RUNNER=d-sorg-fleet
            WHY="repository is '${REPO_VISIBILITY:-unknown}'; hosted runners are metered"
          elif [ "$RUNNER_TARGET" = "local" ]; then
            RUNNER=d-sorg-fleet
            WHY="repository is public but RUNNER_TARGET=local"
          else
            RUNNER=ubuntu-latest
            WHY="repository is public; hosted runners are free and keep fork PRs off the fleet"
          fi
          echo "runner=$RUNNER" >> "$GITHUB_OUTPUT"
          echo "Routing to $RUNNER ($WHY)."
  organize-docs:
    timeout-minutes: 30
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check pause marker
        id: pause
        run: |
          if [ -f .github/WORKFLOWS_PAUSED ]; then
            echo "paused=true" >> "$GITHUB_OUTPUT"
            echo "Workflows are paused."
          else
            echo "paused=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Organize Docs
        if: steps.pause.outputs.paused != 'true'
        run: |
          mkdir -p docs/maintenance
          echo "# Playground Workflow Status" > docs/maintenance/WORKFLOWS.md
          echo "Automated cleanup and organization." >> docs/maintenance/WORKFLOWS.md

      - name: Commit Changes
        if: steps.pause.outputs.paused != 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: nightly documentation organization"
          file_pattern: "docs/maintenance/*"
