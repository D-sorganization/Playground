name: Nightly Documentation Organizer

on:
  schedule:
    - cron: "0 8 * * 2" # Daily at 3 AM PST (11 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Dispatcher: route to self-hosted if available ──────────────────────────
  pick-runner:
    runs-on: d-sorg-fleet
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Check for self-hosted runner
        id: check
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
        run: |
          ONLINE=$(gh api /orgs/${{ github.repository_owner }}/actions/runners \
            --jq '[.runners[] | select(.status == "online") | select(.labels[].name == "d-sorg-fleet")] | length' \
            2>/dev/null || echo "0")
          if [[ "$ONLINE" -gt 0 ]]; then
            mkdir -p "$(dirname "$GITHUB_OUTPUT")"
            mkdir -p "$(dirname "$GITHUB_OUTPUT")"
            echo "runner=d-sorg-fleet" >> "$GITHUB_OUTPUT"
            echo "Self-hosted runner online — routing locally"
          else
            echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
            echo "No self-hosted runner — using local self-hosted"
          fi
  organize-docs:
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check pause marker
        id: pause
        run: |
          if [ -f .github/WORKFLOWS_PAUSED ]; then
            echo "paused=true" >> "$GITHUB_OUTPUT"
            echo "Workflows are paused."
          else
            echo "paused=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Organize Docs
        if: steps.pause.outputs.paused != 'true'
        run: |
          mkdir -p docs/maintenance
          echo "# Playground Workflow Status" > docs/maintenance/WORKFLOWS.md
          echo "Automated cleanup and organization." >> docs/maintenance/WORKFLOWS.md

      - name: Commit Changes
        if: steps.pause.outputs.paused != 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: nightly documentation organization"
          file_pattern: "docs/maintenance/*"
