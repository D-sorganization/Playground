name: Auto-Update PRs
on:
  push:
    branches: ["master", "main"]

permissions:
  contents: write
  pull-requests: write

jobs:
  # ── Dispatcher: route to self-hosted if available ──────────────────────────
  pick-runner:
    runs-on: ${{ vars.RUNNER_TARGET == 'local' && 'd-sorg-fleet' || 'ubuntu-latest' }}
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Select runner
        id: check
        env:
          REPO_VISIBILITY: ${{ github.event.repository.visibility }}
          RUNNER_TARGET: ${{ vars.RUNNER_TARGET }}
        run: |
          mkdir -p "$(dirname "$GITHUB_OUTPUT")"
          if [ "$REPO_VISIBILITY" != "public" ]; then
            # Hosted runners are billed on a non-public repo, so routing is not a
            # preference here and RUNNER_TARGET deliberately does not apply.
            RUNNER=d-sorg-fleet
            WHY="repository is '${REPO_VISIBILITY:-unknown}'; hosted runners are metered"
          elif [ "$RUNNER_TARGET" = "local" ]; then
            RUNNER=d-sorg-fleet
            WHY="repository is public but RUNNER_TARGET=local"
          else
            RUNNER=ubuntu-latest
            WHY="repository is public; hosted runners are free and keep fork PRs off the fleet"
          fi
          echo "runner=$RUNNER" >> "$GITHUB_OUTPUT"
          echo "Routing to $RUNNER ($WHY)."
  update-prs:
    timeout-minutes: 30
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Update PRs with strictly linear history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! PRS=$(gh pr list --state open --json number --jq '.[].number' 2>gh-pr-list.err); then
            cat gh-pr-list.err
            echo "::warning::Skipping auto-update because GitHub PR listing failed."
            exit 0
          fi

          if [ -z "$PRS" ]; then
            echo "No open PRs to update."
            exit 0
          fi

          failed=0
          for pr in $PRS; do
            echo "Updating PR #$pr"
            if ! gh pr update-branch "$pr" --rebase; then
              echo "::warning::Could not update PR #$pr"
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "::warning::One or more PR branches could not be updated automatically."
          fi
