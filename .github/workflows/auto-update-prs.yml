name: Auto-Update PRs
on:
  push:
    branches: ["master", "main"]

permissions:
  contents: write
  pull-requests: write

jobs:
  # ── Dispatcher: route to self-hosted if available ──────────────────────────
  pick-runner:
    runs-on: d-sorg-fleet
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Check for self-hosted runner
        id: check
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
        run: |
          ONLINE=$(gh api /orgs/${{ github.repository_owner }}/actions/runners \
            --jq '[.runners[] | select(.status == "online") | select(.labels[].name == "d-sorg-fleet")] | length' \
            2>/dev/null || echo "0")
          if [[ "$ONLINE" -gt 0 ]]; then
            mkdir -p "$(dirname "$GITHUB_OUTPUT")"
            mkdir -p "$(dirname "$GITHUB_OUTPUT")"
            echo "runner=d-sorg-fleet" >> "$GITHUB_OUTPUT"
            echo "Self-hosted runner online — routing locally"
          else
            echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
            echo "No self-hosted runner — using local self-hosted"
          fi
  update-prs:
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Update PRs with strictly linear history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! PRS=$(gh pr list --state open --json number --jq '.[].number' 2>gh-pr-list.err); then
            cat gh-pr-list.err
            echo "::warning::Skipping auto-update because GitHub PR listing failed."
            exit 0
          fi

          if [ -z "$PRS" ]; then
            echo "No open PRs to update."
            exit 0
          fi

          failed=0
          for pr in $PRS; do
            echo "Updating PR #$pr"
            if ! gh pr update-branch "$pr" --rebase; then
              echo "::warning::Could not update PR #$pr"
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "::warning::One or more PR branches could not be updated automatically."
          fi
