name: Jules Hypatia (Librarian)

on:
  schedule:
    - cron: "0 8 * * 2" # 1st of month at 1 AM PST (9 UTC)
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Dispatcher: route to self-hosted if available ──────────────────────────
  pick-runner:
    runs-on: ${{ vars.RUNNER_TARGET == 'local' && 'd-sorg-fleet' || 'ubuntu-latest' }}
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Select runner
        id: check
        env:
          REPO_VISIBILITY: ${{ github.event.repository.visibility }}
          RUNNER_TARGET: ${{ vars.RUNNER_TARGET }}
        run: |
          mkdir -p "$(dirname "$GITHUB_OUTPUT")"
          if [ "$REPO_VISIBILITY" != "public" ]; then
            # Hosted runners are billed on a non-public repo, so routing is not a
            # preference here and RUNNER_TARGET deliberately does not apply.
            RUNNER=d-sorg-fleet
            WHY="repository is '${REPO_VISIBILITY:-unknown}'; hosted runners are metered"
          elif [ "$RUNNER_TARGET" = "local" ]; then
            RUNNER=d-sorg-fleet
            WHY="repository is public but RUNNER_TARGET=local"
          else
            RUNNER=ubuntu-latest
            WHY="repository is public; hosted runners are free and keep fork PRs off the fleet"
          fi
          echo "runner=$RUNNER" >> "$GITHUB_OUTPUT"
          echo "Routing to $RUNNER ($WHY)."
  archive-stale-docs:
    timeout-minutes: 30
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Identify Stale Documentation
        id: find_stale
        run: |
          # Create archive directory if it doesn't exist
          mkdir -p archive/docs/jules_logs

          # Find .md files in .jules/ that haven't been touched in 30 days
          # We exclude 'sentinel.md' or specific journals if they are permanent records
          find .jules -name "*.md" -mtime +30 -not -name "sentinel.md" -print0 > files_to_move.txt

          if [ -s files_to_move.txt ]; then
            cat files_to_move.txt | xargs -0 -r -I {} mv {} archive/docs/jules_logs/
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Moved stale files to archive/docs/jules_logs/"
          else
            echo "No stale files found."
          fi
          # Clean up temp file
          rm files_to_move.txt

      - name: Commit Archived Files
        if: steps.find_stale.outputs.has_changes == 'true'
        run: |
          git config --global user.name "Jules-Hypatia"
          git config --global user.email "hypatia@jules.bot"
          git add archive/docs
          git add .jules
          git commit -m "chore(docs): archive stale agent logs > 30 days old"
          git push
