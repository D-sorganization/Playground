name: CI Standard
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pick-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Check for self-hosted runner
        id: check
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
        run: "ONLINE=$(gh api /orgs/${{ github.repository_owner }}/actions/runners \\\n  --jq '[.runners[] | select(.status == \"online\") | select(.labels[].name == \"d-sorg-fleet\")] | length' \\\n  2>/dev/null || echo \"0\")\nif [[ \"$ONLINE\" -gt 0 ]]; then\n  echo \"runner=d-sorg-fleet\" >> $GITHUB_OUTPUT\n  echo \"Self-hosted runner online — routing locally\"\nelse\n  echo \"runner=ubuntu-latest\" >> $GITHUB_OUTPUT\n  echo \"No self-hosted runner — using GitHub-hosted\"\nfi"
  quality-gate:
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.11"}
      - run: pip install ruff==0.14.10 mypy==1.13.0 bandit==1.7.7 pydocstyle==6.3.0

      # FIX: Less aggressive Ruff (Errors, Warnings, Imports only)
      - name: Lint
        run: ruff check .

      # FIX: Enforce ruff formatting
      - name: Check Formatting (ruff)
        run: ruff format --check .

      - run: pip install mypy types-PyYAML types-requests
      - run: pip install -r requirements.txt
      - run: mypy . --ignore-missing-imports

      # Placeholder detection - scans Python source files for unresolved TODOs/FIXMEs
      - name: Verify No Placeholders
        run: |
          if grep -rE "TODO|FIXME" . \
              --exclude-dir=vendor \
              --exclude-dir=.git \
              --exclude-dir=node_modules \
              --exclude-dir=.github \
              --exclude-dir=.agent \
              --exclude-dir=.claude \
              --exclude-dir=docs \
              --exclude-dir=tools \
              --exclude-dir="Project_GROOT" \
              --include="*.py" \
              --exclude="analyze_completist_data.py" \
              --exclude="pragmatic_programmer_review.py" \
              --exclude="setup_hooks.py" \
              --exclude="matlab_quality_check.py"; then
             echo "::error::Placeholders found. Remove TODOs/FIXMEs or create tracked GitHub issues."
             exit 1
          fi

      # FIX: Run Python-based MATLAB Quality Check (Works without License)
      # Non-blocking, archives results for legacy support
      - name: MATLAB Quality Check
        continue-on-error: true
        run: |
          python tools/matlab_utilities/scripts/matlab_quality_check.py --output-format text > matlab_quality_report.txt
          cat matlab_quality_report.txt

      - name: Security Audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit || echo "::warning::pip-audit found vulnerabilities (non-blocking)"
        continue-on-error: true

      - name: Upload MATLAB Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: matlab-quality-report
          path: matlab_quality_report.txt
          if-no-files-found: ignore

    needs: pick-runner
  tests:
    needs:
      - pick-runner
      - quality-gate
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    strategy:
      matrix:
        python: ["3.11"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. pytest tests/ --cov=. --cov-report=xml
      - uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        if: env.CODECOV_TOKEN != ''
        with:
          fail_ci_if_error: true # BLOCKING: Requires CODECOV_TOKEN secret to be configured
          token: ${{ secrets.CODECOV_TOKEN }}

  javascript-tests:
    needs:
      - pick-runner
      - quality-gate
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - name: Install & Test
        working-directory: ./
        run: |
          if [ -d "javascript" ]; then
            cd javascript
            npm ci
            npm run test:coverage
          else
            echo "No javascript directory found, skipping."
          fi

  matlab-tests:
    needs: quality-gate
    runs-on: ubuntu-latest
    if: false
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: matlab-actions/setup-matlab@v2
      - uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath('matlab');
            run_all

  arduino-build:
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.11"}
      - run: pip install platformio
      - name: Verify Build
        working-directory: ./
        run: |
          if [ -d "arduino" ]; then
            cd arduino
            pio run -e uno
          else
            echo "No arduino directory found, skipping."
          fi
