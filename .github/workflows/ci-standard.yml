name: CI Standard
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Dispatcher: route to self-hosted if available ──────────────────────────
  pick-runner:
    runs-on: ${{ vars.RUNNER_TARGET == 'local' && 'd-sorg-fleet' || 'ubuntu-latest' }}
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Select runner
        id: check
        env:
          REPO_VISIBILITY: ${{ github.event.repository.visibility }}
          RUNNER_TARGET: ${{ vars.RUNNER_TARGET }}
        run: |
          mkdir -p "$(dirname "$GITHUB_OUTPUT")"
          if [ "$REPO_VISIBILITY" != "public" ]; then
            # Hosted runners are billed on a non-public repo, so routing is not a
            # preference here and RUNNER_TARGET deliberately does not apply.
            RUNNER=d-sorg-fleet
            WHY="repository is '${REPO_VISIBILITY:-unknown}'; hosted runners are metered"
          elif [ "$RUNNER_TARGET" = "local" ]; then
            RUNNER=d-sorg-fleet
            WHY="repository is public but RUNNER_TARGET=local"
          else
            RUNNER=ubuntu-latest
            WHY="repository is public; hosted runners are free and keep fork PRs off the fleet"
          fi
          echo "runner=$RUNNER" >> "$GITHUB_OUTPUT"
          echo "Routing to $RUNNER ($WHY)."
  quality-gate:
    timeout-minutes: 60
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap Python venv
        run: |
          VENV_PATH="$RUNNER_TEMP/ci-venv-${GITHUB_RUN_ID}-${GITHUB_JOB}"
          rm -rf "$VENV_PATH"
          for py in python3.11 python3.12 python3.10 python; do
            if command -v $py &>/dev/null; then
              $py -m venv "$VENV_PATH"
              break
            fi
          done
          source "$VENV_PATH/bin/activate"
          pip install --no-cache-dir --upgrade pip setuptools wheel
          pip install --no-cache-dir ruff==0.14.10 mypy==1.13.0 bandit==1.7.7 pydocstyle==6.3.0
          echo "$VENV_PATH/bin" >> $GITHUB_PATH

      # FIX: Less aggressive Ruff (Errors, Warnings, Imports only)
      - name: Lint
        run: ruff check .

      # FIX: Enforce ruff formatting
      - name: Check Formatting (ruff)
        run: ruff format --check .

      - run: pip install mypy types-PyYAML types-requests
        # src/mypy_agent/ uses implicit namespace packages (same pattern as src/shared/python/)
        # and causes "Source file found twice" errors when scanned with src/ as root.
      - run: mypy src --ignore-missing-imports --exclude src/mypy_agent

      # Placeholder detection - scans Python source files for unresolved TODOs/FIXMEs
      - name: Verify No Placeholders
        run: |
          if grep -rE "TODO|FIXME" . \
              --exclude-dir=vendor \
              --exclude-dir=.git \
              --exclude-dir=node_modules \
              --exclude-dir=.github \
              --exclude-dir=.agent \
              --exclude-dir=.claude \
              --exclude-dir=docs \
              --exclude-dir=tools \
              --exclude-dir="Project_GROOT" \
              --include="*.py" \
              --exclude="analyze_completist_data.py" \
              --exclude="pragmatic_programmer_review.py" \
              --exclude="setup_hooks.py" \
              --exclude="matlab_quality_check.py"; then
             echo "::error::Placeholders found. Remove TODOs/FIXMEs or create tracked GitHub issues."
             exit 1
          fi

      # FIX: Run Python-based MATLAB Quality Check (Works without License)
      # Non-blocking, archives results for legacy support
      - name: MATLAB Quality Check
        continue-on-error: true
        run: |
          python tools/matlab_utilities/scripts/matlab_quality_check.py --output-format text > matlab_quality_report.txt
          cat matlab_quality_report.txt

      - name: Security Audit (pip-audit)
        run: |
          pip install --no-cache-dir pip-audit
          pip-audit

      - name: Upload MATLAB Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matlab-quality-report
          path: matlab_quality_report.txt
          if-no-files-found: ignore

  tests:
    timeout-minutes: 60
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap Python venv
        run: |
          VENV_PATH="$RUNNER_TEMP/ci-venv-${GITHUB_RUN_ID}-${GITHUB_JOB}"
          rm -rf "$VENV_PATH"
          for py in python3.11 python3.12 python3.10 python; do
            if command -v $py &>/dev/null; then
              $py -m venv "$VENV_PATH"
              break
            fi
          done
          source "$VENV_PATH/bin/activate"
          pip install --no-cache-dir --upgrade pip setuptools wheel
          pip install --no-cache-dir -r requirements.txt numpy
          echo "$VENV_PATH/bin" >> $GITHUB_PATH
      - name: Run tests
        run: PYTHONPATH=.:src pytest tests/ --cov=. --cov-report=xml --cov-fail-under=60
      - uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        if: env.CODECOV_TOKEN != ''
        with:
          fail_ci_if_error: true # BLOCKING: Requires CODECOV_TOKEN secret to be configured
          token: ${{ secrets.CODECOV_TOKEN }}

  javascript-tests:
    timeout-minutes: 30
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: ${{ hashFiles('javascript/package-lock.json') != '' }}
        with:
          cache: "npm"
          node-version: "22"
      - name: Install & Test
        if: ${{ hashFiles('javascript/package-lock.json') != '' }}
        run: |
          cd javascript
          npm ci
          npm run test:coverage
      - name: Skip JavaScript tests
        if: ${{ hashFiles('javascript/package-lock.json') == '' }}
        run: echo "No javascript/package-lock.json found, skipping JavaScript tests."

  matlab-tests:
    timeout-minutes: 30
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    if: false
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v2
      - uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath('matlab');
            run_all

  arduino-build:
    timeout-minutes: 60
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: ${{ hashFiles('arduino/platformio.ini') != '' }}
        with:
          cache: "pip"
          python-version: "3.11"
      - run: pip install platformio
        if: ${{ hashFiles('arduino/platformio.ini') != '' }}
      - name: Verify Build
        if: ${{ hashFiles('arduino/platformio.ini') != '' }}
        run: |
          cd arduino
          pio run -e uno
      - name: Skip Arduino build
        if: ${{ hashFiles('arduino/platformio.ini') == '' }}
        run: echo "No arduino/platformio.ini found, skipping Arduino build."

  local-only-workflows:
    timeout-minutes: 30
    name: Reject hosted runner routing
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Run local-only workflow guard
        shell: bash
        env:
          REPO_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          set -euo pipefail
          python3 scripts/check_local_only_workflows.py
