name: CI Standard
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".github/**"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".github/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install ruff==0.14.10 black==26.1.0 mypy==1.13.0 bandit==1.7.7 pydocstyle==6.3.0

      # Validate that CI tool versions match pre-commit config
      - name: Check Tool Version Consistency
        run: |
          echo "Validating tool versions match .pre-commit-config.yaml..."

          # Check Black version
          if ! grep -q "rev: 26.1.0" .pre-commit-config.yaml; then
            echo "::error::Black version mismatch between CI and pre-commit config"
            exit 1
          fi

          # Check Ruff version
          if ! grep -q "rev: v0.14.10" .pre-commit-config.yaml; then
            echo "::error::Ruff version mismatch between CI and pre-commit config"
            exit 1
          fi

          # Check MyPy version
          if ! grep -q "rev: v1.10.0" .pre-commit-config.yaml; then
            echo "::error::MyPy version mismatch between CI and pre-commit config"
            exit 1
          fi

          echo "✓ All tool versions are consistent"

      # FIX: Less aggressive Ruff (Errors, Warnings, Imports only)
      - name: Lint
        run: ruff check .

      # FIX: Enforce Black formatting (88 chars)
      - name: Check Formatting
        run: black --check .

      - run: pip install mypy types-PyYAML types-requests
      - run: pip install -r requirements.txt
      - run: mypy . --ignore-missing-imports --exclude="MyoSim|GolfSwingAnalysis|GolfSwingSim|scripts|Project_GROOT|src/Project_GROOT"

      # Quality check using our custom tool - non-blocking for playground repo
      - name: Run Quality Check
        continue-on-error: true
        run: |
          python tools/code_quality_check.py || echo "Quality check completed with issues (non-blocking for playground repo)"

      # TODO detection - informational only for playground repo
      - name: Check for Placeholders (Informational)
        continue-on-error: true
        run: |
          EXCLUDE_ARGS='--exclude-dir=vendor --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.github --exclude-dir=.ruff_cache --exclude=*.md'
          if grep -rE "TODO|FIXME" . $EXCLUDE_ARGS; then
             echo "::warning::Placeholders found. Consider removing TODOs/FIXMEs or creating tracked GitHub issues."
          else
             echo "✓ No placeholders found"
          fi

      # FIX: Run Python-based MATLAB Quality Check (Works without License)
      # Non-blocking, archives results for legacy support
      - name: MATLAB Quality Check
        continue-on-error: true
        run: |
          python tools/matlab_utilities/scripts/matlab_quality_check.py --output-format text > matlab_quality_report.txt
          cat matlab_quality_report.txt

      - name: Upload MATLAB Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matlab-quality-report
          path: matlab_quality_report.txt

  tests:
    needs: quality-gate
    runs-on: ubuntu-latest
    if: false # Disabled - no active Python projects in template playground
    strategy:
      matrix:
        python: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt
      - run: pytest tests/ --cov=. --cov-report=xml
      - uses: codecov/codecov-action@v4
        continue-on-error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        if: env.CODECOV_TOKEN != ''
        with:
          fail_ci_if_error: false # Non-blocking for playground repo
          token: ${{ secrets.CODECOV_TOKEN }}

  javascript-tests:
    needs: quality-gate
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install & Test
        working-directory: ./javascript
        run: |
          npm ci
          npm run test:coverage

  # =============================================================================
  # MATLAB TESTS - DISABLED BY DEFAULT
  # =============================================================================
  # This job requires a MATLAB license which is NOT available in GitHub CI.
  # DO NOT enable (remove 'if: false') unless you have configured MATLAB licensing.
  # To enable: set 'if: true' and configure matlab-actions.
  # Users with local MATLAB can run: matlab/run_all.m for equivalent tests.
  # =============================================================================
  matlab-tests:
    needs: quality-gate
    runs-on: ubuntu-latest
    if: false  # DISABLED - Requires MATLAB license not available in CI
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v2
      - uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath('matlab');
            run_all

  # =============================================================================
  # ARDUINO BUILD - DISABLED BY DEFAULT
  # =============================================================================
  # No active Arduino projects in template playground - disabled.
  # =============================================================================
  arduino-build:
    needs: quality-gate
    runs-on: ubuntu-latest
    if: false  # DISABLED - No active Arduino projects in playground
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install platformio
      - name: Verify Build
        working-directory: ./arduino
        run: pio run -e uno

