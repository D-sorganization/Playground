name: Jules Archivist

on:
  workflow_call:

# ✅ PERMISSION FIX: Grants access to delete remote branches
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Dispatcher: route to self-hosted if available ──────────────────────────
  pick-runner:
    runs-on: ${{ vars.RUNNER_TARGET == 'local' && 'd-sorg-fleet' || 'ubuntu-latest' }}
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Select runner
        id: check
        env:
          REPO_VISIBILITY: ${{ github.event.repository.visibility }}
          RUNNER_TARGET: ${{ vars.RUNNER_TARGET }}
        run: |
          mkdir -p "$(dirname "$GITHUB_OUTPUT")"
          if [ "$REPO_VISIBILITY" != "public" ]; then
            # Hosted runners are billed on a non-public repo, so routing is not a
            # preference here and RUNNER_TARGET deliberately does not apply.
            RUNNER=d-sorg-fleet
            WHY="repository is '${REPO_VISIBILITY:-unknown}'; hosted runners are metered"
          elif [ "$RUNNER_TARGET" = "local" ]; then
            RUNNER=d-sorg-fleet
            WHY="repository is public but RUNNER_TARGET=local"
          else
            RUNNER=ubuntu-latest
            WHY="repository is public; hosted runners are free and keep fork PRs off the fleet"
          fi
          echo "runner=$RUNNER" >> "$GITHUB_OUTPUT"
          echo "Routing to $RUNNER ($WHY)."
  archive-tasks:
    timeout-minutes: 30
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cleanup Merged Branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fetch list of merged PR branches starting with 'jules/'
          # Note: We filter by the branch prefix used by your agent
          if ! BRANCHES=$(gh pr list --state merged --limit 100 --json headRefName --jq '.[] | select(.headRefName | startswith("jules/")) | .headRefName' 2>gh-pr-list.err); then
            cat gh-pr-list.err
            echo "::warning::Skipping archivist cleanup because GitHub PR listing failed."
            exit 0
          fi

          if [ -z "$BRANCHES" ]; then
            echo "No branches to cleanup."
            exit 0
          fi

          for BRANCH in $BRANCHES; do
            echo "Deleting merged branch: $BRANCH"
            # Delete remote branch
            git push origin --delete "$BRANCH" || true
          done
