name: Architecture Map Contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-architecture-map:
    name: Validate Architecture Map Contract
    runs-on: ${{ vars.RUNNER_TARGET == 'local' && 'd-sorg-fleet' || 'ubuntu-latest' }}
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Architecture Map Contract
        run: |
          python scripts/architecture_map_contract.py --path docs/architecture/C4.md

      - name: Run Architecture Map Contract Tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests/test_architecture_map_contract.py -v
