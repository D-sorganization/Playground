name: Semgrep Workflow Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan-workflows:
    timeout-minutes: 45
    name: Scan GitHub Actions workflows
    runs-on: d-sorg-fleet
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep against workflow files
        run: |
          python3 -m venv venv
          venv/bin/pip install --upgrade --upgrade-strategy only-if-needed semgrep==1.102.0
          venv/bin/semgrep \
            --config p/github-actions \
            --config p/secrets \
            --disable-version-check \
            --metrics=off \
            --no-error \
            --sarif \
            --output semgrep.sarif \
            .github/workflows

      - name: Upload Semgrep SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-workflow-sarif
          path: semgrep.sarif
          if-no-files-found: error
