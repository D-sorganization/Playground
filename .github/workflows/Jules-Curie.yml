name: Jules Curie (Data Hygiene)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 2" # 1st of month at 2 AM PST (10 UTC)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Dispatcher: route to self-hosted if available ──────────────────────────
  pick-runner:
    runs-on: ${{ vars.RUNNER_TARGET == 'local' && 'd-sorg-fleet' || 'ubuntu-latest' }}
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Select runner
        id: check
        env:
          REPO_VISIBILITY: ${{ github.event.repository.visibility }}
          RUNNER_TARGET: ${{ vars.RUNNER_TARGET }}
        run: |
          mkdir -p "$(dirname "$GITHUB_OUTPUT")"
          if [ "$REPO_VISIBILITY" != "public" ]; then
            # Hosted runners are billed on a non-public repo, so routing is not a
            # preference here and RUNNER_TARGET deliberately does not apply.
            RUNNER=d-sorg-fleet
            WHY="repository is '${REPO_VISIBILITY:-unknown}'; hosted runners are metered"
          elif [ "$RUNNER_TARGET" = "local" ]; then
            RUNNER=d-sorg-fleet
            WHY="repository is public but RUNNER_TARGET=local"
          else
            RUNNER=ubuntu-latest
            WHY="repository is public; hosted runners are free and keep fork PRs off the fleet"
          fi
          echo "runner=$RUNNER" >> "$GITHUB_OUTPUT"
          echo "Routing to $RUNNER ($WHY)."
  hygiene-check:
    timeout-minutes: 20
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Find Large Files (>10MB)
        id: large_files
        run: |
          find . -type f -size +10M -not -path "./.git/*" > large_files.txt

      - name: Curie Journal Entry
        run: |
          echo "## $(date +'%Y-%m-%d') - Monthly Hygiene Check" >> .jules/curie.md
          if [ -s large_files.txt ]; then
            echo "**⚠️ Large Files Detected:**" >> .jules/curie.md
            cat large_files.txt >> .jules/curie.md
          else
            echo "✅ No large files detected." >> .jules/curie.md
          fi
          echo "" >> .jules/curie.md

      - name: Commit Journal Updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs(curie): monthly hygiene report"
          file_pattern: ".jules/curie.md"
