name: Jules Curie (Data Hygiene)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 2" # 1st of month at 2 AM PST (10 UTC)

jobs:
  # ── Dispatcher: route to self-hosted if available ──────────────────────────
  pick-runner:
    runs-on: d-sorg-fleet
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Check for self-hosted runner
        id: check
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
        run: |
          ONLINE=$(gh api /orgs/${{ github.repository_owner }}/actions/runners \
            --jq '[.runners[] | select(.status == "online") | select(.labels[].name == "d-sorg-fleet")] | length' \
            2>/dev/null || echo "0")
          if [[ "$ONLINE" -gt 0 ]]; then
            mkdir -p "$(dirname "$GITHUB_OUTPUT")"
            mkdir -p "$(dirname "$GITHUB_OUTPUT")"
            echo "runner=d-sorg-fleet" >> "$GITHUB_OUTPUT"
            echo "Self-hosted runner online — routing locally"
          else
            echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
            echo "No self-hosted runner — using local self-hosted"
          fi
  hygiene-check:
    timeout-minutes: 20
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Find Large Files (>10MB)
        id: large_files
        run: |
          find . -type f -size +10M -not -path "./.git/*" > large_files.txt

      - name: Curie Journal Entry
        run: |
          echo "## $(date +'%Y-%m-%d') - Monthly Hygiene Check" >> .jules/curie.md
          if [ -s large_files.txt ]; then
            echo "**⚠️ Large Files Detected:**" >> .jules/curie.md
            cat large_files.txt >> .jules/curie.md
          else
            echo "✅ No large files detected." >> .jules/curie.md
          fi
          echo "" >> .jules/curie.md

      - name: Commit Journal Updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs(curie): monthly hygiene report"
          file_pattern: ".jules/curie.md"
