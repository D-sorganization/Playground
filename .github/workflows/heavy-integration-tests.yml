name: Heavy Integration Suite

on:
  schedule:
    # Run every Sunday at midnight
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for running heavy tests manually"
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  heavy-tests:
    timeout-minutes: 120
    runs-on: ${{ vars.RUNNER_TARGET == 'local' && 'd-sorg-fleet' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      # This job used to say dependencies were pre-installed on the custom
      # runner. A hosted runner is a bare image, so the install below is now
      # load-bearing rather than a convenience.
      - name: Install local requirements
        run: |
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi
          if [ -f "pyproject.toml" ]; then pip install -e .; fi

      - name: Run heavy live simulations
        # No coverage gate here: the repo-wide fail_under applies to the main
        # suite, not this marker subset (#504). Exit 5 means no test carries
        # the live_simulation marker yet; any other failure still fails.
        run: |
          set +e
          pytest -v -m "live_simulation"
          rc=$?
          if [ "$rc" -eq 5 ]; then
            echo "::notice::No live_simulation tests selected"
            rc=0
          fi
          exit $rc
