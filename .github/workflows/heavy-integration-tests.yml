name: Heavy Integration Suite

on:
  schedule:
    # Run every Sunday at midnight
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for running heavy tests manually"
        required: false

jobs:
  heavy-tests:
    timeout-minutes: 120
    runs-on: ${{ vars.RUNNER_TARGET == 'local' && 'd-sorg-fleet' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      # This job used to assume the fleet desktops had everything preinstalled.
      # A hosted runner is a bare image, so install what the suite needs --
      # including the Qt shared objects PyQt6 links against but does not ship.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libgles2 libdbus-1-3 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

      - name: Install local requirements
        run: |
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi
          if [ -f "pyproject.toml" ]; then pip install -e .; fi

      - name: Run heavy live simulations
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # Example of running only tests marked for live simulation
          pytest -v -m "live_simulation" --cov
