name: CI - Playground Quality Checks

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  python-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true  # Playground projects can ignore CI results
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better diffs
          
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements*.txt', '**/pyproject.toml', '**/setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            
      - name: Install CI tools
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit==3.5.0 ruff==0.5.0 mypy==1.10.0 black==24.4.2 pytest==8.3.3 pytest-cov==6.0.0
          
      - name: Install project dependencies
        run: |
          # Find and install requirements files
          find . -name "requirements*.txt" -not -path "./.git/*" | while read req; do
            echo "Installing from $req"
            pip install -r "$req" || echo "⚠️ Failed to install from $req"
          done
          
      - name: Python Code Quality Check
        continue-on-error: true
        run: |
          echo "=========================================="
          echo "Python Code Quality Checks"
          echo "=========================================="
          if [ -f scripts/quality-check.py ]; then
            python scripts/quality-check.py || echo "⚠️ Quality check script found issues"
          elif [ -f scripts/quality_check.py ]; then
            python scripts/quality_check.py || echo "⚠️ Quality check script found issues"
          elif [ -f quality_check_script.py ]; then
            python quality_check_script.py || echo "⚠️ Quality check script found issues"
          else
            echo "ℹ️ No quality check script found (optional for playground projects)"
          fi
          
      - name: Check for placeholders (informational)
        continue-on-error: true
        run: |
          echo "Checking for placeholders (TODO, FIXME, etc.)..."
          if grep -r "TODO\|FIXME\|XXX\|HACK\|pass #\|\.\.\..*#\|NotImplementedError" \
            --include="*.py" \
            --exclude-dir=".git" \
            --exclude-dir="archive" \
            --exclude-dir="legacy" \
            --exclude-dir="experimental" \
            --exclude-dir="__pycache__" . 2>/dev/null; then
            echo "⚠️ INFO: Placeholders found in code (acceptable for playground projects)"
          else
            echo "✅ No placeholders found"
          fi
            
      - name: Check for magic numbers (informational)
        continue-on-error: true
        run: |
          echo "Checking for magic numbers..."
          if grep -r "[^0-9a-zA-Z_]3\.14[0-9]*\|9\.8[0-9]*\|6\.67[0-9]*\|2\.71[0-9]*" \
            --include="*.py" \
            --exclude-dir=".git" \
            --exclude-dir="tests" \
            --exclude-dir="__pycache__" . 2>/dev/null; then
            echo "ℹ️ INFO: Possible magic numbers found (consider using named constants)"
            echo "Examples: 3.14→math.pi, 9.8→GRAVITY_M_S2, 2.71→math.e"
          else
            echo "✅ No obvious magic numbers found"
          fi
          
      - name: Run pre-commit (if configured)
        continue-on-error: true
        run: |
          if [ -f .pre-commit-config.yaml ]; then
            echo "Running pre-commit hooks..."
            pre-commit run --all-files || echo "⚠️ Pre-commit found issues (non-blocking)"
          else
            echo "ℹ️ No .pre-commit-config.yaml found (optional for playground projects)"
          fi
          
      - name: Lint with ruff
        continue-on-error: true
        run: |
          if find . -name "*.py" -not -path "./.git/*" -not -path "./*/__pycache__/*" | head -n1 | grep -q .; then
            if [ -f ruff.toml ]; then
              echo "Running ruff with ruff.toml configuration..."
              ruff check . || echo "⚠️ Ruff found linting issues"
            else
              echo "Running ruff with default configuration..."
              ruff check . --select E,F,W || echo "⚠️ Ruff found linting issues"
            fi
          else
            echo "No Python files found to lint"
          fi
          
      - name: Format check with black
        continue-on-error: true
        run: |
          if find . -name "*.py" -not -path "./.git/*" -not -path "./*/__pycache__/*" | head -n1 | grep -q .; then
            echo "Checking code formatting with black..."
            black --check . || echo "⚠️ Code formatting issues found (run 'black .' to fix)"
          else
            echo "No Python files found to format check"
          fi
          
      - name: Type checking with mypy
        continue-on-error: true
        run: |
          if find . -name "*.py" -not -path "./.git/*" -not -path "./*/__pycache__/*" -not -path "./archive/*" -not -path "./legacy/*" | head -n1 | grep -q .; then
            if [ -f mypy.ini ]; then
              echo "Running mypy with mypy.ini configuration..."
              mypy . --config-file=mypy.ini || echo "⚠️ Type checking found issues"
            else
              echo "Running mypy with basic configuration..."
              mypy . --ignore-missing-imports || echo "⚠️ Type checking found issues"
            fi
          else
            echo "No Python files found to type check"
          fi
          
      - name: Run tests (if available)
        continue-on-error: true
        run: |
          if [ -d tests ] || [ -d python/tests ] || find . -name "test_*.py" -not -path "./.git/*" | head -n1 | grep -q .; then
            echo "Running tests..."
            # Try to find the source directory
            if [ -d python ]; then
              pytest -xvs --cov=python --cov-report=term-missing || echo "⚠️ Tests failed or coverage below threshold"
            else
              pytest -xvs --cov=. --cov-report=term-missing || echo "⚠️ Tests failed or coverage below threshold"
            fi
          else
            echo "ℹ️ No tests found (optional for playground projects)"
          fi
          
      - name: Check for unseeded randomness (informational)
        continue-on-error: true
        run: |
          echo "Checking for unseeded randomness..."
          found_issues=false
          for file in $(find . -name "*.py" -type f -not -path "./.git/*" -not -path "./archive/*" -not -path "./legacy/*" -not -path "./*/__pycache__/*"); do
            if grep -q "np\.random\|random\.\|torch\." "$file" 2>/dev/null; then
              if ! grep -q "seed\|random_state\|generator" "$file"; then
                echo "ℹ️ INFO: $file uses randomness without visible seed"
                found_issues=true
              fi
            fi
          done
          if [ "$found_issues" = false ]; then
            echo "✅ All randomness appears to be seeded"
          fi

  javascript-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true  # Playground projects can ignore CI results
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Note: cache is not enabled because it requires package-lock.json
          # For playground projects, caching is optional
          
      - name: Install dependencies
        run: |
          # Find and install package.json files
          find . -name "package.json" -not -path "./.git/*" -not -path "*/node_modules/*" | while read pkg; do
            dir=$(dirname "$pkg")
            echo "Installing dependencies from $dir"
            cd "$dir" && npm install || echo "⚠️ Failed to install from $dir"
            cd - > /dev/null
          done
          
      - name: Run ESLint (if configured)
        continue-on-error: true
        run: |
          if find . -name ".eslintrc*" -o -name "eslint.config.*" -not -path "*/node_modules/*" | head -n1 | grep -q .; then
            echo "Running ESLint..."
            find . -name "package.json" -not -path "./.git/*" -not -path "*/node_modules/*" | while read pkg; do
              dir=$(dirname "$pkg")
              if grep -q '"lint"' "$pkg"; then
                echo "Running lint in $dir"
                cd "$dir" && npm run lint || echo "⚠️ ESLint found issues in $dir"
                cd - > /dev/null
              fi
            done
          else
            echo "ℹ️ No ESLint configuration found (optional for playground projects)"
          fi
          
      - name: Run Prettier check (if configured)
        continue-on-error: true
        run: |
          if find . -name ".prettierrc*" -o -name "prettier.config.*" -not -path "*/node_modules/*" | head -n1 | grep -q .; then
            echo "Checking code formatting with Prettier..."
            find . -name "package.json" -not -path "./.git/*" -not -path "*/node_modules/*" | while read pkg; do
              dir=$(dirname "$pkg")
              if grep -q '"format"' "$pkg" || grep -q '"prettier"' "$pkg"; then
                echo "Running format check in $dir"
                cd "$dir" && npm run format -- --check || echo "⚠️ Prettier found formatting issues in $dir"
                cd - > /dev/null
              fi
            done
          else
            echo "ℹ️ No Prettier configuration found (optional for playground projects)"
          fi
          
      - name: TypeScript type check (if configured)
        continue-on-error: true
        run: |
          if find . -name "tsconfig.json" -not -path "./.git/*" -not -path "*/node_modules/*" | head -n1 | grep -q .; then
            echo "Running TypeScript type check..."
            find . -name "tsconfig.json" -not -path "./.git/*" -not -path "*/node_modules/*" | while read tsconfig; do
              dir=$(dirname "$tsconfig")
              echo "Type checking in $dir"
              cd "$dir" && npx tsc --noEmit || echo "⚠️ TypeScript found type errors in $dir"
              cd - > /dev/null
            done
          else
            echo "ℹ️ No TypeScript configuration found (optional for playground projects)"
          fi
          
      - name: Run tests (if available)
        continue-on-error: true
        run: |
          find . -name "package.json" -not -path "./.git/*" -not -path "*/node_modules/*" | while read pkg; do
            dir=$(dirname "$pkg")
            if grep -q '"test"' "$pkg"; then
              echo "Running tests in $dir"
              cd "$dir" && npm test || echo "⚠️ Tests failed in $dir"
              cd - > /dev/null
            fi
          done

  matlab-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true  # Playground projects can ignore CI results
    if: false  # Disabled by default - enable when MATLAB runner is available
    
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v2
      - uses: matlab-actions/run-command@v2
        with:
          command: |
            % Add paths
            if exist('matlab', 'dir')
                addpath(genpath('matlab'));
            end
            
            % Check for magic numbers in MATLAB
            mFiles = dir('**/*.m');
            for i = 1:length(mFiles)
                content = fileread(fullfile(mFiles(i).folder, mFiles(i).name));
                if contains(content, {'3.14', '9.8', '6.67'})
                    warning('Possible magic number in %s', mFiles(i).name);
                end
            end
            
            % Run tests if available
            if exist('matlab/tests', 'dir')
                results = runtests('matlab/tests');
                assertSuccess(results);
            end

  ci-summary:
    runs-on: ubuntu-latest
    needs: [python-checks, javascript-checks, matlab-checks]
    if: always()
    
    steps:
      - name: CI Summary
        run: |
          echo "### 🎮 Playground CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** This is a playground repository. CI checks are informational and non-blocking." >> $GITHUB_STEP_SUMMARY
          echo "You can merge PRs even if checks fail - use your judgment!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Python Checks | ${{ needs.python-checks.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| JavaScript/TypeScript Checks | ${{ needs.javascript-checks.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| MATLAB Checks | ${{ needs.matlab-checks.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### How to Use" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **All checks passed**: Great! Your code follows best practices." >> $GITHUB_STEP_SUMMARY
          echo "- ⚠️ **Some checks failed**: Review the output to see what could be improved, but feel free to merge if it's a pet project." >> $GITHUB_STEP_SUMMARY
          echo "- ❌ **All checks failed**: Consider fixing critical issues, but merging is still allowed for experimental code." >> $GITHUB_STEP_SUMMARY

