repos:
# Python formatters
- repo: https://github.com/psf/black
  rev: 24.4.2
  hooks:
    - id: black
      language_version: python3.11

- repo: https://github.com/PyCQA/isort
  rev: 5.13.2
  hooks:
    - id: isort
      args: ["--profile", "black"]

# Python linter
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.5.0
  hooks:
    - id: ruff
      args: ["--fix", "--select", "E,F,W,I,N,UP,B,C4,SIM", "--ignore", "D,ANN,PLR,PLW,PLC,PLE"]
      # More lenient for playground projects

# Type checker (optional - can be skipped)
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v1.10.0
  hooks:
    - id: mypy
      additional_dependencies: ["types-requests", "types-PyYAML"]
      args: [--config-file=mypy.ini]
      types: [python]
      exclude: |
        (?x)^(
          matlab/|
          javascript/|
          node_modules/|
          archive/|
          legacy/|
          experimental/|
          \.git/|
          __pycache__/|
          \.pytest_cache/|
          \.venv/|
          venv/
        )

# Jupyter notebook cleaner
- repo: https://github.com/kynan/nbstripout
  rev: 0.7.1
  hooks:
    - id: nbstripout

# Local quality checks (optional - only if script exists)
- repo: local
  hooks:
    - id: quality-check
      name: Quality check (no placeholders/magic numbers)
      entry: bash -c 'if [ -f scripts/quality_check.py ]; then python scripts/quality_check.py; else exit 0; fi'
      language: system
      pass_filenames: false
      always_run: true

# JavaScript/TypeScript formatters (optional - uncomment when adding JS/TS code)
# - repo: https://github.com/pre-commit/mirrors-prettier
