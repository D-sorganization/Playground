[mypy]
python_version = 3.11
# More lenient settings for playground projects
warn_return_any = True
warn_unused_configs = True
# Allow untyped definitions in playground
disallow_untyped_defs = False
disallow_any_unimported = True
no_implicit_optional = True
check_untyped_defs = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
strict_equality = True

# Allow some flexibility - more lenient for playground
disallow_untyped_calls = False
disallow_incomplete_defs = False
disallow_untyped_decorators = False

# Don't allow Any types (still enforce this)
disallow_any_explicit = False
disallow_any_generics = True
disallow_subclassing_any = True

# Error on missing imports - set globally for all external libraries
ignore_missing_imports = True
follow_imports = normal

# Exclude MATLAB and JavaScript/TypeScript directories
# Also exclude duplicate pendulum model directories
exclude = ^(matlab/|javascript/|node_modules/|Pendulum Models/Pendulums_Model/)

# Legacy/experimental code to ignore
[mypy-archive.*]
ignore_errors = True

[mypy-legacy.*]
ignore_errors = True

[mypy-experimental.*]
ignore_errors = True

# Common libraries without stubs
[mypy-moderngl.*]
ignore_missing_imports = True

[mypy-numba.*]
ignore_missing_imports = True

[mypy-psutil.*]
ignore_missing_imports = True

# Qt stacks
[mypy-PyQt5.*]
ignore_missing_imports = True

[mypy-PyQt6.*]
ignore_missing_imports = True

[mypy-PySide6.*]
ignore_missing_imports = True



