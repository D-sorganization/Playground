[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "playground"
version = "0.1.0"
description = "Fleet-wide playground for testing and experimentation"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[tool.ruff]
target-version = "py311"
select = ["E", "F", "B", "UP", "I"]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.pytest.ini_options]
markers = [
    "live_simulation: marks tests as live simulation tests requiring fleet infrastructure (deselect with '-m \"not live_simulation\"')",
]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
